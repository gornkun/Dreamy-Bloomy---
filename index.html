<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบการใช้งาน</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 0; padding: 20px; background-color: #f4f6f9; }

        /* Modal ควบคุมการล็อกอิน */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex;
            align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content { background: #fff; padding: 25px; border-radius: 8px; text-align: center; max-width: 400px; width: 90%; }
        
        /* สไตล์ระบบแท็บ */
        .nav-btn { padding: 10px 20px; margin-right: 5px; cursor: pointer; border: 1px solid #ccc; background: #e0e0e0; }
        .nav-btn.active { background: #007bff; color: white; border-color: #007bff; }
        
        /* ซ่อนหน้าเพจทั้งหมดเป็นค่าเริ่มต้น */
        .page-section { display: none; background: white; padding: 20px; border-radius: 8px; margin-top: 15px; }
        /* แสดงเฉพาะหน้าที่มี class active-page */
        .page-section.active-page { display: block; }

        /* ตราประทับแต้ม */
        .stamp-box { display: flex; gap: 10px; margin: 10px 0; }
        .stamp { border: 1px solid #ccc; padding: 10px; border-radius: 5px; background: #eee; }
        .stamp.active { background: #28a745; color: white; }
        
        /* รายการรีวิว */
        .review-item { border-bottom: 1px solid #ddd; padding: 10px 0; }
    </style>
</head>
<body>

    <!-- Modal 1: หน้าแรกต้อนรับ -->
    <div id="welcome-modal" class="modal">
        <div class="modal-content">
            <h2>ยินดีต้อนรับ เข้าสู่ระบบ</h2>
            <button onclick="openForm('staff')">🪪 สำหรับพนักงาน</button>
            <button onclick="openForm('customer')">🛍️ สำหรับลูกค้า</button>
        </div>
    </div>

    <!-- Modal 2: กรอกชื่อ -->
    <div id="login-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">เข้าสู่ระบบ</h3>
            <input type="text" id="user-name-input" placeholder="ระบุชื่อของคุณ..." style="width: 80%; padding: 8px; margin: 10px 0;"><br>
            <button onclick="submitLogin()">ตกลง</button>
            <button onclick="closeModal()">ยกเลิก</button>
        </div>
    </div>

    <!-- แถบเมนูเปลี่ยนหน้า -->
    <nav>
        <button id="btn-staff" class="nav-btn" onclick="switchTab('staff-tab', this)">พนักงาน</button>
        <button id="btn-point" class="nav-btn" onclick="switchTab('point-tab', this)">สะสมแต้ม</button>
        <button id="btn-review" class="nav-btn" onclick="switchTab('review-tab', this)">รีวิว</button>
    </nav>

    <!-- หน้าที่ 1: ระบบพนักงาน -->
    <section id="staff-tab" class="page-section">
        <h3>จัดการบัตรพนักงาน</h3>
        <input type="text" id="emp-name" placeholder="ชื่อพนักงาน"><br><br>
        <input type="text" id="emp-pos" placeholder="ตำแหน่ง"><br><br>
        <input type="text" id="emp-fb" placeholder="ลิงก์ Facebook"><br><br>
        <input type="file" onchange="previewEmpImage(event)"><br><br>
        <button onclick="generateEmpCard()">สร้างบัตร</button>

        <div id="emp-card-display" style="display:none; border:1px solid #000; margin-top:15px; padding:10px; gap:10px;">
            <img id="emp-preview-img" width="80" height="80" style="object-fit:cover; background:#ccc;">
            <div>
                <h4 id="emp-card-name" style="margin:0;"></h4>
                <p id="emp-card-pos" style="margin:5px 0;"></p>
                <a id="emp-card-fb" href="#" target="_blank">Facebook</a>
            </div>
        </div>
    </section>

    <!-- หน้าที่ 2: ระบบสะสมแต้ม -->
    <section id="point-tab" class="page-section">
        <h3>ระบบสะสมแต้มลูกค้า</h3>
        <input type="text" id="point-name" placeholder="ชื่อลูกค้า">
        <button onclick="addPoint()">เพิ่ม 1 แต้ม</button>

        <div id="point-result" style="display:none; margin-top:15px;">
            <p id="display-customer-name"></p>
            <p>แต้มสะสมปัจจุบัน: <span id="current-point-count">0</span> แต้ม</p>
            
            <div class="stamp-box">
                <div id="stamp-3" class="stamp">ครบ 3 แต้ม</div>
                <div id="stamp-5" class="stamp">ครบ 5 แต้ม</div>
                <div id="stamp-10" class="stamp">ครบ 10 แต้ม</div>
            </div>

            <div id="vip-section" style="display:none; color: gold; background: #333; padding: 10px; border-radius: 5px;">
                🎉 คุณ <span id="vip-card-name-display"></span> ได้รับสิทธิ์ VIP Card!
            </div>
        </div>
    </section>

    <!-- หน้าที่ 3: ระบบรีวิว -->
    <section id="review-tab" class="page-section">
        <h3>รีวิวจากลูกค้า</h3>
        <input type="text" id="rev-name" placeholder="ชื่อผู้รีวิว"><br><br>
        <textarea id="rev-text" placeholder="พิมพ์รีวิวที่นี่..."></textarea><br><br>
        <button onclick="addReview()">ส่งรีวิว</button>

        <h4>รายการรีวิวทั้งหมด</h4>
        <div id="reviews-list"></div>
    </section>

    <!-- JavaScript ควบคุมการทำงานของระบบ -->
    <script>
        var currentRole = '';
        var customerPoints = {};

        function closeModal() {
            document.getElementById('welcome-modal').style.display = 'none';
            document.getElementById('login-modal').style.display = 'none';
        }

        function openForm(role) {
            currentRole = role;
            document.getElementById('welcome-modal').style.display = 'none';
            document.getElementById('login-modal').style.display = 'flex';
            
            var title = document.getElementById('modal-title');
            if(role === 'staff') {
                title.innerText = '🪪 สำหรับพนักงาน (กรอกชื่อเพื่อเข้าสู่ระบบ)';
            } else {
                title.innerText = '🛍️ สำหรับลูกค้า (กรอกชื่อเพื่อไปหน้ารีวิว)';
            }
        }

        function submitLogin() {
            var name = document.getElementById('user-name-input').value.trim();
            if (!name) {
                alert('กรุณากรอกชื่อก่อนเข้าใช้งาน');
                return;
            }

            closeModal();

            if (currentRole === 'staff') {
                document.body.classList.remove('customer-mode');
                document.getElementById('emp-name').value = name;
                switchTab('staff-tab', document.getElementById('btn-staff'));
            } else if (currentRole === 'customer') {
                document.body.classList.add('customer-mode');
                document.getElementById('rev-name').value = name;
                switchTab('review-tab', document.getElementById('btn-review'));
            }
        }

        function switchTab(tabId, btnElement) {
            var sections = document.querySelectorAll('.page-section');
            sections.forEach(function(sec) {
                sec.classList.remove('active-page');
            });

            var navBtns = document.querySelectorAll('.nav-btn');
            navBtns.forEach(function(btn) {
                btn.classList.remove('active');
            });

            var targetSection = document.getElementById(tabId);
            if (targetSection) {
                targetSection.classList.add('active-page');
            }

            if (btnElement) {
                btnElement.classList.add('active');
            }
        }

        function previewEmpImage(event) {
            var reader = new FileReader();
            reader.onload = function() {
                var output = document.getElementById('emp-preview-img');
                output.src = reader.result;
            }
            if (event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function generateEmpCard() {
            var name = document.getElementById('emp-name').value.trim();
            var pos = document.getElementById('emp-pos').value.trim();
            var fb = document.getElementById('emp-fb').value.trim();

            if (!name) {
                alert('กรุณากรอกชื่อพนักงาน');
                return;
            }

            document.getElementById('emp-card-name').innerText = name;
            document.getElementById('emp-card-pos').innerText = pos || 'พนักงาน';
            document.getElementById('emp-card-fb').href = fb || '#';
            document.getElementById('emp-card-display').style.display = 'flex';
        }

        function addPoint() {
            var name = document.getElementById('point-name').value.trim();
            if (!name) {
                alert('กรุณาระบุชื่อลูกค้า');
                return;
            }

            if (!customerPoints[name]) {
                customerPoints[name] = 0;
            }
            customerPoints[name] += 1;

            var points = customerPoints[name];
            document.getElementById('display-customer-name').innerText = 'ชื่อลูกค้า: ' + name;
            document.getElementById('current-point-count').innerText = points;
            document.getElementById('point-result').style.display = 'block';

            document.getElementById('stamp-3').classList.toggle('active', points >= 3);
            document.getElementById('stamp-5').classList.toggle('active', points >= 5);
            document.getElementById('stamp-10').classList.toggle('active', points >= 10);

            if (points >= 10) {
                document.getElementById('vip-card-name-display').innerText = name;
                document.getElementById('vip-section').style.display = 'block';
            }
        }

        function addReview() {
            var name = document.getElementById('rev-name').value.trim();
            var text = document.getElementById('rev-text').value.trim();

            if (!name || !text) {
                alert('กรุณากรอกชื่อและข้อความรีวิว');
                return;
            }

            var list = document.getElementById('reviews-list');
            var newItem = document.createElement('div');
            newItem.className = 'review-item';
            newItem.innerHTML = '<strong>คุณ ' + name + '</strong><p>' + text + '</p>';
            
            list.insertBefore(newItem, list.firstChild);
            document.getElementById('rev-text').value = '';
            alert('ส่งรีวิวเรียบร้อยแล้ว ขอบคุณครับ!');
        }
    </script>
</body>
</html>
